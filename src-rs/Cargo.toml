[package]
name = "prizrak-box-rs"
version = "1.0.21"
edition = "2021"
license = "GPL-3.0-only"
description = "Prizrak-Box desktop shell (Rust + Slint)"
authors = ["legiz-ru"]
publish = false
build = "build.rs"

[[bin]]
name = "prizrak-box"
path = "src/main.rs"

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-skia", "renderer-software", "accessibility", "unstable-winit-030"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "process", "signal"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico", "tiff"] }
resvg = "0.45"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
base64 = "0.22"
md5 = "0.7"
rand = "0.8"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
url = "2"
percent-encoding = "2"
open = "5"
arboard = { version = "3", default-features = false }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
notify-rust = "4"
dirs = "6"
global-hotkey = "0.7"
interprocess = "2"
whoami = "1"

[target.'cfg(target_os = "linux")'.dependencies.reqwest]
version = "0.12"
default-features = false
features = ["json", "rustls-tls", "gzip"]

# Windows (schannel) and macOS (Security.framework) use the system TLS stack:
# no C toolchain needed for ring, which matters for the arm64 Windows build.
[target.'cfg(not(target_os = "linux"))'.dependencies.reqwest]
version = "0.12"
default-features = false
features = ["json", "native-tls", "gzip"]

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.23", default-features = false }
mac-notification-sys = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSData", "NSGeometry", "NSAppleEventDescriptor", "NSAppleEventManager", "NSDictionary"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSApplication", "NSRunningApplication", "NSWindow"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Without the default `libxdo` feature: muda needs libxdo only for predefined
# Copy/Paste/... items, which this tray does not use, and the packages do not
# depend on libxdo3 — with it the binary fails to load on a clean system.
tray-icon = { version = "0.23", default-features = false }
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.23", default-features = false }
tauri-winrt-notification = "0.8"
# Same windows-rs as tauri-winrt-notification: the subscription toast with a
# protocol launch link (notify.rs) builds its XML directly.
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications", "Foundation"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security", "Win32_UI_HiDpi", "Win32_Graphics_Dwm"] }

[build-dependencies]
slint-build = "1.18"
embed-resource = "3"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

# Image decoding / blurring is unbearably slow unoptimised (backgrounds,
# scrim backdrops); keep debug builds usable.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
