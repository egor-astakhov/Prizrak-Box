# nfpm config for the Rust + Slint build's Linux packages (.deb / .rpm / Arch).
# Run from the repo root (CI does), e.g.:
#   PKG_ARCH=amd64 PKG_VERSION=1.0.21 nfpm pkg -p deb -f src-rs/packaging/linux/nfpm.yaml -t out.deb
#
# Same package name, paths, desktop entry, polkit action and service scripts as
# the Electron and Wails packages: installing it replaces either of them in
# place (they are the same application sharing ~/Prizrak-Box-V3), and installing
# one of them later replaces it back.
name: prizrak-box
arch: ${PKG_ARCH}
version: ${PKG_VERSION}
version_schema: none
section: net
priority: optional
maintainer: legiz-ru <legiz-ru@users.noreply.github.com>
description: A Simple Mihomo GUI (Rust + Slint build)
homepage: https://github.com/legiz-ru/Prizrak-Box
license: GPL-3.0

contents:
  # Owned by the package, so removing it does not leave an empty directory
  # behind (rpm/dpkg only delete directories a package lists).
  - dst: /usr/lib/prizrak-box
    type: dir
    file_info: { mode: 0755 }
  - src: src-rs/target/release/prizrak-box
    dst: /usr/lib/prizrak-box/prizrak-box
    file_info: { mode: 0755 }
  - src: src-go/px
    dst: /usr/lib/prizrak-box/px
    file_info: { mode: 0755 }
  - src: src-service/px-service
    dst: /usr/lib/prizrak-box/px-service
    file_info: { mode: 0755 }
  - src: build/appicon.png
    dst: /usr/share/icons/hicolor/512x512/apps/prizrak-box.png
  - src: src-wails/build/linux/com.legiz-ru.prizrak-box.desktop
    dst: /usr/share/applications/com.legiz-ru.prizrak-box.desktop
  - src: src-wails/build/linux/com.legiz-ru.prizrak-box.policy
    dst: /usr/share/polkit-1/actions/com.legiz-ru.prizrak-box.policy
  - src: /usr/lib/prizrak-box/prizrak-box
    dst: /usr/bin/prizrak-box
    type: symlink

scripts:
  postinstall: src-wails/build/linux/postinstall.sh
  preremove: src-wails/build/linux/preremove.sh

archlinux:
  packager: legiz-ru <legiz-ru@users.noreply.github.com>
  scripts:
    postupgrade: src-wails/build/linux/postinstall.sh

overrides:
  # Slint draws through OpenGL (Skia) with a software fallback and loads
  # X11/Wayland at runtime; GTK 3 + AppIndicator host the tray icon. winit
  # dlopens libxkbcommon-x11 on an X11 display and aborts without it.
  deb:
    depends:
      - libgtk-3-0 | libgtk-3-0t64
      - libayatana-appindicator3-1 | libappindicator3-1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libfontconfig1
    recommends:
      - libegl1
      # Debian 12+ / Ubuntu 23.04+ split pkexec out of polkitd; without it the
      # service cannot be installed or removed from the app's settings.
      - pkexec | policykit-1
      - xdg-utils
  rpm:
    depends:
      - gtk3
      - libayatana-appindicator-gtk3
      - libxkbcommon
      - libxkbcommon-x11
      - fontconfig
    recommends:
      - mesa-libEGL
      - polkit
      - xdg-utils
  archlinux:
    depends:
      - gtk3
      - libayatana-appindicator
      - libxkbcommon
      - libxkbcommon-x11
      - fontconfig
      - polkit
      - xdg-utils
