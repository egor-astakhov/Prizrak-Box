name: Build Rust + Slint (TEST)

# Compile check + test for the Rust + Slint shell (src-rs) on every desktop
# target. Release packaging (MSI / DMG / deb / rpm / Arch) lives in
# release.yml (build_*_rs jobs); this workflow only proves the shell builds
# and its unit tests pass.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src-rs/**'
      - 'src/locales/**'
      - '.github/workflows/rs-build.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: 'src-rs -> target', key: '${{ matrix.target }}' }
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev libayatana-appindicator3-dev libfontconfig1-dev libxkbcommon-dev
      - name: Build
        working-directory: src-rs
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Unit tests
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-pc-windows-msvc'
        working-directory: src-rs
        run: cargo test --release --locked --target ${{ matrix.target }}
